name: karma-team

# Container image sources
# -----------------------
# Docker Hub (registry-1.docker.io) is unreachable from the deployment
# network, so infra images are pulled from mirrors that resolve on this host:
#   * swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/...  (Huawei Cloud)
#   * docker.m.daocloud.io/...                                (DaoCloud)
# Build-stage base images (node / nginx / python / caddy) are pinned to the
# same mirrors in the apps/*/Dockerfile* files. If your network can reach
# Docker Hub, you may swap these back to the canonical `postgres`, `valkey`,
# `rabbitmq`, `minio` names.

services:
  web:
    container_name: web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.web
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    depends_on:
      - api

  admin:
    container_name: admin
    build:
      context: .
      dockerfile: ./apps/admin/Dockerfile.admin
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    depends_on:
      - api
      - web

  space:
    container_name: space
    build:
      context: .
      dockerfile: ./apps/space/Dockerfile.space
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    depends_on:
      - api
      - web

  api:
    container_name: api
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: ./bin/docker-entrypoint-api.sh
    env_file:
      - ./apps/api/.env
    volumes:
      - ${KARMA_TEAM_CLI_ARTIFACTS_HOST_DIR:-./deployments/cli/artifacts}:/code/cli-artifacts:ro
      - ./runner:/code/cli-installers:ro
    depends_on:
      - karma-team-db
      - karma-team-redis

  worker:
    container_name: bgworker
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: ./bin/docker-entrypoint-worker.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - api
      - karma-team-db
      - karma-team-redis

  beat-worker:
    container_name: beatworker
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: ./bin/docker-entrypoint-beat.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - api
      - karma-team-db
      - karma-team-redis

  migrator:
    container_name: karma-team-migrator
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: no
    command: ./bin/docker-entrypoint-migrator.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - karma-team-db
      - karma-team-redis

  live:
    container_name: karma-team-live
    build:
      context: .
      dockerfile: ./apps/live/Dockerfile.live
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    # Live needs API_BASE_URL + LIVE_SERVER_SECRET_KEY at runtime;
    # without env_file it crash-loops with "Invalid environment variables".
    env_file:
      - ./apps/live/.env
    # The .env at apps/live/.env points Redis at localhost (works for
    # `pnpm dev` on the host). Inside docker-compose the actual host is
    # karma-team-redis; the explicit environment entries below shadow the
    # .env values so the container connects to the compose-network
    # service. API_BASE_URL gets the same docker-aware override so live
    # talks to the api container, not the host.
    environment:
      # The live app reads PORT from its .env (3100, for `pnpm dev` on the
      # host). The Docker deployment serves it behind the proxy on 3000
      # (matching Dockerfile.live EXPOSE and the Caddyfile), so pin it here.
      PORT: "3000"
      REDIS_HOST: karma-team-redis
      REDIS_PORT: 6379
      REDIS_URL: redis://karma-team-redis:6379/
      API_BASE_URL: http://api:8000
    # Shares the default Compose network with the API and Redis services.

  karma-team-db:
    container_name: karma-team-db
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/postgres:15.7-alpine
    restart: always
    command: postgres -c 'max_connections=1000'
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data

  karma-team-redis:
    container_name: karma-team-redis
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/valkey/valkey:7.2.11-alpine
    restart: always
    volumes:
      - redisdata:/data

  karma-team-mq:
    container_name: karma-team-mq
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/rabbitmq:3.13.6-management-alpine
    restart: always
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  karma-team-minio:
    container_name: karma-team-minio
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/minio/minio:RELEASE.2025-05-24T17-08-30Z
    restart: always
    command: server /export --console-address ":9090"
    volumes:
      - uploads:/export
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}

  # Comment this if you already have a reverse proxy running
  proxy:
    container_name: proxy
    build:
      context: ./apps/proxy
      dockerfile: Dockerfile.ce
    restart: always
    ports:
      - ${LISTEN_HTTP_PORT}:80
      - ${LISTEN_HTTPS_PORT}:443
    environment:
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      # Caddy substitutes {$SITE_ADDRESS} into the site block address.
      # Without it, the line collapses to an empty unkeyed block which
      # Caddy 2.10's parser rejects with "server block without any key
      # is global configuration, and if used, it must be first".
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      CERT_EMAIL: ${CERT_EMAIL:-}
      CERT_ACME_CA: ${CERT_ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
      CERT_ACME_DNS: ${CERT_ACME_DNS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-0.0.0.0/0}
    depends_on:
      - web
      - api
      - space
      - admin

volumes:
  pgdata:
  redisdata:
  uploads:
  rabbitmq_data:
